<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mmsub Movie</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; }
        .movie-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .movie { cursor: pointer; }
        .movie img { width: 200px; border-radius: 10px; }
        iframe { width: 200px; height: 200px; border: none; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Mmsub Movie</h1>
    <input type="text" id="search" placeholder="Search movies..." onkeyup="filterMovies()">
    <div class="movie-container" id="movie-list">
        <div class="movie" onclick="playMovie">

            <iframe src="//ok.ru/videoembed/9567876549360?nochat=1" frameborder="0" allow="autoplay" allowfullscreen>


            <img src="images.jpg" alt="Movie 1">
            <p>Movie 1</p>
        </iframe>
        </div>
        <div class="movie" onclick="playMovie">

            <iframe src="//ok.ru/videoembed/9567876549360?nochat=1" frameborder="0" allow="autoplay" allowfullscreen>


            <img src="images.jpg" alt="Movie 2">
            <p>Movie 1</p>
        </iframe>
        </div>
        <div class="movie" onclick="playMovie">

            <iframe src="//ok.ru/videoembed/9567876549360?nochat=1" frameborder="0" allow="autoplay" allowfullscreen>


            <img src="images.jpg" alt="Movie 1">
            <p>Movie 1</p>
        </iframe>
        </div>
        <div class="movie" onclick="playMovie">

            <iframe src="//ok.ru/videoembed/9567876549360?nochat=1" frameborder="0" allow="autoplay" allowfullscreen>


            <img src="images.jpg" alt="Movie 1">
            <p>Movie 1</p>
        </iframe>
        </div>
    <iframe id="player" src="" allowfullscreen></iframe>

    <script>
        function playMovie(url) {
            document.getElementById('player').src = url;
        }
        
        function filterMovies() {
            let query = document.getElementById('search').value.toLowerCase();
            let movies = document.querySelectorAll('.movie');
            movies.forEach(movie => {
                let title = movie.textContent.toLowerCase();
                movie.style.display = title.includes(query) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
