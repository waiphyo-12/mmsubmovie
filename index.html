<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MMsub Movie</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      margin: 0;
      padding: 0;
    }
     
    .menu-container {
      background-color: #222;
      padding: 10px;
      position: relative;
    }

    .menu-toggle {
      background: #f60;
      color: white;
      border: none;
      padding: 12px 15px;
      font-size: 20px;
      border-radius: 6px;
      width: 20%;
    }

    .menu-items {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
      background: #333;
      margin-top: 5px;
      border-radius: 0 0 6px 6px;
    }

    .menu-items a {
      display: block;
      padding: 12px;
      border-bottom: 1px solid #444;
      text-decoration: none;
      color: white;
      font-size: 25px;
    }

    .menu-items a:last-child {
      border-bottom: none;
    }

    .menu-items.show {
      max-height: 500px; /* enough to show all items */
    }

    header {
      background-color: #222;
      padding: 1em;
      text-align: center;
    }

    input[type="text"] {
      padding: 10px;
      width: 50%;
      font-size: 24px;
      border-radius: 8px;
      border: none;
      align-content: center;
      justify-content: center;
      margin-left: 30%;
    }

    #movieList {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2em;
      gap: 30px;
    }

    .movie-card {
      background: #1e1e1e;
      padding: 2em;
      border-radius: 10px;
      width: 250px;
      font-size: 20px;
      text-align: center;
      box-shadow: 0 0 2px rgba(255,255,255,0.1);
    }

    .movie-card img {
      width: 100%;
      border-radius: 8px;
    }

    .movie-card h3 {
      font-size: 25px;
      margin: 10px 0;
    }

    .movie-card button {
      background-color: #f60;
      color: white;
      border: none;
      padding: 20px 40px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 20px;
    }

    #videoModal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    #videoContainer {
      background-color: #000;
      padding: 20px;
      border-radius: 12px;
      max-width: 90%;
    }

    
    .movie button {
      padding: 10px 16px;
      background: #f60;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #videoModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 10px;
    }

    #videoContainer {
      background: #000;
      padding: 10px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
    }

    iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
    }

    .closeBtn {
      background: red;
      color: white;
      padding: 10px;
      margin-top: 10px;
      border: none;
      width: 100%;
      border-radius: 6px;
    }
  
  </style>
</head>
<body>
  
     <header>
      <h1>MMsub Movie</h1>
    
  </header> 
   <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="searchMovies()">

  <div class="menu-container">
    <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>
    <div class="menu-items" id="menu">
      <a href="#home">🏠 Home</a>
      <a href="Action.html">🎬 Action </a>
      <a href="cartoon.html">🎬 Cartoon</a>
      <a href="ghost.html">🎬 Ghosts</a>
      <a href="comedy.html">🎬 Comedy</a>
      <a href="myamya.pro">🎬 myamya</a>

    </div>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById("menu");
      menu.classList.toggle("show");
    }
  </script>

  <div id="movieList"></div>

  <!-- Video Modal -->
  <div id="videoModal" onclick="closeModal()">
    <div id="videoContainer" onclick="event.stopPropagation()">
      <iframe id="videoPlayer" src="" allowfullscreen></iframe>
      <button class="closeBtn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const movies = [
      {
        title: "Along with the Gods 2",
        poster: "/img/Along with the Gods 2.jpg",
        okruLink: "//ok.ru/videoembed/9567876549360?nochat=1"
      },
      {
        title: "The Boss Baby [2017]",
        poster: "/img/The Boss baby [2017].jpg",
        okruLink: "//ok.ru/videoembed/9617878616816?nochat=1"
      },
      {
        title: "Kubo and Two Strings (2016)",
        poster: "/img/Kubo and Two Strings (2016).jpg",
        okruLink: "//ok.ru/videoembed/9618061331184?nochat=1"
      },
      {
        title: "Nadaaniyan",
        poster: "/action/Nadaaniyan.jpg",
        okruLink: "//ok.ru/videoembed/9618713742064?nochat=1"
      },

      {
        title: "Jessabelle.2014",
        poster: "/ghost/Jessabelle.2014.jpg",
        okruLink: "//ok.ru/videoembed/9620205734640?nochat=1"
      },
      {
        title: "The Village (2023)",
        poster: "/action/The Village (2023).jpg",
        okruLink: ""
      },
    
      {
        title: "Carl's Date (2023)",
        poster: "/img/Carl's Date (2023).jpg",
        okruLink: "https://ok.ru/videoembed/4291222381233"
      }
    ];

    function displayMovies(list) {
      const container = document.getElementById("movieList");
      container.innerHTML = "";
      list.forEach(movie => {
        const card = document.createElement("div");
        card.className = "movie-card";
        card.innerHTML = `
          <img src="${movie.poster}" alt="${movie.title}">
          <h3>${movie.title}</h3>
          <button onclick="playMovie('${movie.okruLink}')">▶ Watch</button>
        `;
        container.appendChild(card);
      });
    }

    function searchMovies() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = movies.filter(movie =>
        movie.title.toLowerCase().includes(query)
      );
      displayMovies(filtered);
    }

    function playMovie(url) {
      const player = document.getElementById("videoPlayer");
      const modal = document.getElementById("videoModal");
      player.src = url;
      modal.style.display = "flex";
    }

    function closeModal() {
      const modal = document.getElementById("videoModal");
      const player = document.getElementById("videoPlayer");
      player.src = ""; // Stop the video
      modal.style.display = "none";
    }

    window.onload = () => {
      displayMovies(movies);
    };
  </script>

</body>
</html>
