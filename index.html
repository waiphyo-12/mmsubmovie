<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OK.ru Movie App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #222;
      padding: 1em;
      text-align: center;
    }

    input[type="text"] {
      padding: 10px;
      width: 50%;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }

    #movieList {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2em;
      gap: 35px;
    }

    .movie-card {
      background: #1e1e1e;
      padding: 2em;
      border-radius: 10px;
      width: 180px;
      text-align: center;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .movie-card img {
      width: 100%;
      border-radius: 8px;
    }

    .movie-card h3 {
      font-size: 16px;
      margin: 10px 0;
    }

    .movie-card button {
      background-color: #f60;
      color: white;
      border: none;
      padding: 20px 40px;
      border-radius: 5px;
      cursor: pointer;
    }

    #videoModal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    #videoContainer {
      background-color: #000;
      padding: 20px;
      border-radius: 12px;
      max-width: 90%;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 10px;
    }

    .closeBtn {
      margin-top: 10px;
      background: #f33;
      color: white;
      border: none;
      padding: 20px 40px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>MMsub Movie</h1>
    <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="searchMovies()">
  </header>

  <div id="movieList"></div>

  <!-- Video Modal -->
  <div id="videoModal" onclick="closeModal()">
    <div id="videoContainer" onclick="event.stopPropagation()">
      <iframe id="videoPlayer" src="" allowfullscreen></iframe>
      <button class="closeBtn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const movies = [
      {
        title: "Along with the Gods 2",
        poster: "Along with the Gods 2.jpg",
        okruLink: "//ok.ru/videoembed/9567876549360?nochat=1"
      },
      {
        title: "The Boss Baby [2017]",
        poster: "The Boss Baby [2017].jpg",
        okruLink: "//ok.ru/videoembed/9617878616816?nochat=1"
      },
      {
        title: "Kubo and Two Strings (2016)",
        poster: "Kubo and Two Strings (2016).jpg",
        okruLink: "//ok.ru/videoembed/9618061331184?nochat=1"
      },
      {
        title: "Monkey King Reborn [2021]",
        poster: "Monkey King Reborn [2021].jpg",
        okruLink: "https://ok.ru/videoembed/4291222381233"
      },
      {
        title: "Carl's Date (2023)",
        poster: "Carl's Date (2023).jpg",
        okruLink: "https://ok.ru/videoembed/4291222381233"
      }
    ];

    function displayMovies(list) {
      const container = document.getElementById("movieList");
      container.innerHTML = "";
      list.forEach(movie => {
        const card = document.createElement("div");
        card.className = "movie-card";
        card.innerHTML = `
          <img src="${movie.poster}" alt="${movie.title}">
          <h3>${movie.title}</h3>
          <button onclick="playMovie('${movie.okruLink}')">▶ Watch</button>
        `;
        container.appendChild(card);
      });
    }

    function searchMovies() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = movies.filter(movie =>
        movie.title.toLowerCase().includes(query)
      );
      displayMovies(filtered);
    }

    function playMovie(url) {
      const player = document.getElementById("videoPlayer");
      const modal = document.getElementById("videoModal");
      player.src = url;
      modal.style.display = "flex";
    }

    function closeModal() {
      const modal = document.getElementById("videoModal");
      const player = document.getElementById("videoPlayer");
      player.src = ""; // Stop the video
      modal.style.display = "none";
    }

    window.onload = () => {
      displayMovies(movies);
    };
  </script>

</body>
</html>
